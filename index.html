            left: 0;
            right: 0;

let selectedIds = [];
let currentFilter = "all";
let searchQuery = "";

function getCardImage(id) {
    return `https://royaleapi.com/static/img/cards-150/${id}.png`;
}

function getRarityClass(r) { return `rarity-${r}`; }
function showToast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.innerText = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2100); }

function renderSelected() {
    const container = document.getElementById('selectedList');
    if (selectedIds.length === 0) { container.innerHTML = '<div class="empty-selected">✨ Нажми на карту, чтобы AI подобрал колоды</div>'; return; }
    container.innerHTML = selectedIds.map(id => { const c = cardsData.find(c => c.id === id); return `<div class="selected-card"><img src="${getCardImage(id)}" onerror="this.src='https://royaleapi.com/static/img/cards-150/unknown.png'"><span>${c.name}</span><span class="remove-card" data-id="${id}">✕</span></div>`; }).join('');
    document.querySelectorAll('.remove-card').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); selectedIds = selectedIds.filter(i => i !== btn.dataset.id); renderSelected(); renderCards(); filterDecks(); }); });
}

function renderCards() {
    const filtered = cardsData.filter(c => { if (currentFilter !== 'all' && c.rarity !== currentFilter) return false; if (searchQuery && !c.name.toLowerCase().includes(searchQuery.toLowerCase())) return false; return true; });
    const grid = document.getElementById('cardsGrid');
    grid.innerHTML = filtered.map(c => `<div class="card-item ${selectedIds.includes(c.id) ? 'selected' : ''} ${getRarityClass(c.rarity)}" onclick="toggleCard('${c.id}')"><div class="card-elixir">${c.elixir}</div><img src="${getCardImage(c.id)}" onerror="this.src='https://royaleapi.com/static/img/cards-150/unknown.png'"><div class="card-name">${c.name}</div>${c.hasEvo ? '<div class="card-evo-icon">⚡</div>' : ''}</div>`).join('');
}

function toggleCard(id) {
    if (selectedIds.includes(id)) { selectedIds = selectedIds.filter(i => i !== id); } 
    else { if (selectedIds.length >= 4) { showToast("❌ Максимум 4 карты для подбора"); return; } selectedIds.push(id); }
    renderSelected(); renderCards(); filterDecks();
}

function filterDecks() {
    const container = document.getElementById('decksGrid');
    if (selectedIds.length === 0) { container.innerHTML = '<div style="padding: 30px; text-align: center; color: #7f85a5;">✨ Выберите карты, и AI покажет подходящие колоды</div>'; return; }
    
    // Ранжируем колоды: сначала по количеству совпадений, затем по винрейту
    const ranked = metaDecks.map(deck => {
        const matchCount = deck.cards.filter(cid => selectedIds.includes(cid)).length;
        const matchPercent = Math.round((matchCount / selectedIds.length) * 100);
        const winrateNum = parseFloat(deck.winrate);
        return { ...deck, matchCount, matchPercent, winrateNum };
    }).filter(d => d.matchCount > 0).sort((a, b) => {
        if (a.matchCount !== b.matchCount) return b.matchCount - a.matchCount;
        return b.winrateNum - a.winrateNum;
    });
    
    if (ranked.length === 0) { container.innerHTML = '<div style="padding: 30px; text-align: center; color: #7f85a5;">😕 Нет колод с этими картами. Попробуйте другие.</div>'; return; }
    container.innerHTML = ranked.map(deck => `<div class="deck-item" onclick="copyDeck('${deck.cards.join(";")}')"><div class="deck-header"><span class="deck-name">${deck.name}</span><div class="deck-stats"><span class="deck-winrate">${deck.winrate}</span><span class="deck-match">совп. ${deck.matchPercent}%</span></div></div><div class="deck-cards">${deck.cards.map(cid => `<img src="${getCardImage(cid)}" onerror="this.style.display='none'">`).join('')}</div></div>`).join('');
}

function copyDeck(deckString) { const link = `https://link.clashroyale.com/deck/ru?deck=${deckString}`; navigator.clipboard.writeText(link).then(() => { showToast("✅ Ссылка скопирована! Открываю игру..."); window.open(link, '_blank'); }).catch(() => prompt("Скопируйте ссылку:", link)); }
function clearSelected() { selectedIds = []; renderSelected(); renderCards(); filterDecks(); showToast("🧹 Список карт очищен"); }

document.querySelectorAll('.filter-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentFilter = btn.dataset.filter; renderCards(); }); });
document.getElementById('searchInput').addEventListener('input', (e) => { searchQuery = e.target.value; renderCards(); });
document.getElementById('clearBtn').addEventListener('click', clearSelected);

renderCards(); renderSelected(); filterDecks();
</script>
